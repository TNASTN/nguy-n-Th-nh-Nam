    <!-- Fix for browser extensions attempting to overwrite window.fetch when it only has a getter -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _curFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _curFetch;
            },
            set: function(fn) {
              _curFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if cannot redefine
        }

        // Prevent browser extension script errors from crashing the application
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
